<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Counter</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    #count {
      font-size: 72px;
      font-weight: bold;
      margin-bottom: 24px;
      min-width: 120px;
      text-align: center;
    }
    .buttons {
      display: flex;
      gap: 12px;
    }
    button {
      font-size: 24px;
      padding: 10px 28px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #0078d4;
      color: white;
    }
    button:hover { background: #005a9e; }
    #reset {
      background: #888;
      font-size: 16px;
      padding: 10px 20px;
    }
    #reset:hover { background: #555; }
  </style>
</head>
<body>
  <div id="count">0</div>
  <div class="buttons">
    <button id="dec">−</button>
    <button id="inc">＋</button>
  </div>
  <br>
  <button id="reset">Reset</button>

  <script>
    const { ipcRenderer } = require('@devscholar/node-with-window');
    const display = document.getElementById('count');

    async function refresh() {
      display.textContent = await ipcRenderer.invoke('get-count');
    }

    document.getElementById('inc').onclick = async () => {
      display.textContent = await ipcRenderer.invoke('increment');
    };
    document.getElementById('dec').onclick = async () => {
      display.textContent = await ipcRenderer.invoke('decrement');
    };
    document.getElementById('reset').onclick = async () => {
      display.textContent = await ipcRenderer.invoke('reset');
    };

    refresh();
  </script>
</body>
</html>
